<div *ngIf="project" class="modal fade" [id]="project.modalId" tabindex="-1" role="dialog" [attr.aria-labelledby]="project.modalId + '-label'" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <div class="col-md-12">
          <div class="row justify-content-around">
            <h4 class="modal-title" [id]="project.modalId + '-label'">{{ project.modalTitle }}</h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="container-fluid">
          <div class="col-md-12">
            <div class="row justify-content-around">
              <div class="responsive mt-2" *ngFor="let image of project.modalImages">
                <div class="gallery">
                  <a target="_blank" [href]="image.src">
                    <img [src]="image.src" [alt]="image.alt" width="600" height="400" loading="lazy">
                  </a>
                  <div class="desc">{{ image.desc }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <div class="col-md-12">
          <div class="row d-flex justify-content-center mb-2">
            <button type="button" class="btn btn-danger" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">Close</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
